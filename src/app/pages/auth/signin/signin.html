<div class="flex justify-center items-center min-h-screen bg-slate-700 text-white">
  <div class="flex flex-col gap-4">
    <div><img src="img/logo.png" alt="Logo" class="mx-auto h-16 w-16" /></div>
    <h1 class="text-center text-3xl font-bold text-white">Roller Les loups</h1>
    <div class="text-center">Tapez le code</div>
    <input
      type="password"
      (input)="onCodeChange($event.target.value)"
      class="h-12 text-black bg-white rounded shadow-md text-center"
    />
    <button type="button" mat-raised-button (click)="signin()">Se connecter</button>
  </div>
</div>
