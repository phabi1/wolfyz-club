<ng-template #formTpl>
  <h1 mat-dialog-title i18n="@@membership.periods.new.dialogTitle">Add period</h1>
  <div mat-dialog-content>
    <formly-form [form]="form" [fields]="fields" [model]="model"></formly-form>
  </div>
  <div mat-dialog-actions>
    <button type="button" mat-button (click)="onCancel()" i18n="@@common.button.cancel">Cancel</button>
    <button type="button" mat-button cdkFocusInitial [disabled]="form.invalid" (click)="onSubmit()" i18n="@@common.button.add">Add</button>
  </div>
</ng-template>
