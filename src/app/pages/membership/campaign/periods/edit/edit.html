<ng-template #formTpl>
  <h1 mat-dialog-title i18n="@@membership.periods.edit.dialogTitle">Edit period</h1>
  <div mat-dialog-content>
    <formly-form [form]="form" [fields]="fields" [model]="model"></formly-form>
  </div>
  <div mat-dialog-actions>
    <button type="button" mat-button (click)="onCancel()" i18n="@@common.button.cancel">Cancel</button>
    <button
      type="button"
      mat-button
      cdkFocusInitial
      [disabled]="form.invalid"
      (click)="onSubmit()"
      i18n="@@common.button.save"
    >
      Save
    </button>
  </div>
</ng-template>
