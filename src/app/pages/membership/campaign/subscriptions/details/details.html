<app-ui-page title="Subscription details" i18n-title="@@membership.subscriptions.details.pageTitle">
  @if (store.loading()) {
    <p i18n="@@common.label.loading">Loading...</p>
  }
  @else  {
    <div class="flex flex-col gap-4">
      <app-membership-subscription-details-overview-section
        [item]="store.item()"
        [contactsCount]="store.item().contacts.length"
        [sessionsCount]="store.item().sessions?.length || 0"
      ></app-membership-subscription-details-overview-section>
      <app-membership-subscription-details-member-section
        [item]="store.item()"
        [busy]="isMemberUpdating()"
        (change)="onMemberChange($event)"
      ></app-membership-subscription-details-member-section>
      <app-membership-subscription-details-license-section
        [item]="store.item()"
        [busy]="isLicenseUpdating()"
        (change)="onLicenseChange($event)"
      >
      </app-membership-subscription-details-license-section>
      <app-membership-subscription-details-sessions-section
        [lessons]="store.lessons()"
        [busy]="isSessionsUpdating()"
        [sessions]="store.item().sessions || []"
        (sessionsChange)="onSessionsChange($event)"
      ></app-membership-subscription-details-sessions-section>
      <app-membership-subscription-details-contacts-section
        [contacts]="store.item().contacts || []"
        [busy]="isContactsUpdating()"
        (contactsChange)="onContactsChange($event)"
      ></app-membership-subscription-details-contacts-section>
    </div>
  }
</app-ui-page>
