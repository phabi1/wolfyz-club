<app-ui-page
  headingTitle="Subscriptions"
  i18n-headingTitle="@@membership.subscriptions.pageTitle"
  [actions]="pageActions"
>
  <app-ui-datagrid
    [columns]="store.columns()"
    [rows]="store.items()"
    [total]="store.total()"
    [rowActions]="rowActions"
    [bulkActions]="bulkActions",
    [currentPage]="store.page()"
    [quickSearch]="true"
    [search]="store.search()"
    (rowClick)="onRowClick($event.row)"
    (searchChange)="onSearchChange($event)"
    (paginationChange)="
      onPaginationChange({
        page: $event.page,
        size: $event.size,
      })
    "
  ></app-ui-datagrid>
</app-ui-page>
