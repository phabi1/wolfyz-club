<app-ui-page title="Subscriptions">
  <app-ui-datagrid
    [columns]="store.columns()"
    [rows]="store.items()"
    [total]="store.total()"
    [rowActions]="rowActions"
    [currentPage]="store.page()"
    [search]="store.search()"
    (searchChange)="onSearchChange($event)"
    (paginationChange)="
      onPaginationChange({
        page: $event.page,
        size: $event.size,
      })
    "
  ></app-ui-datagrid>
</app-ui-page>
