<div>
  <div class="flex gap-1 mb-4">
    @if (hasBulkActions()) {
      <button mat-raised-button color="primary" (click)="selectAllRows()" i18n="@@common.button.selectAll">
        Select All
      </button>
      <button mat-raised-button color="primary" (click)="deselectAllRows()" i18n="@@common.button.deselectAll">
        Deselect All
      </button>
    }
  </div>
</div>
<div class="rounded-md overflow-hidden overflow-x-auto border shadow bg-white">
  <table mat-table [dataSource]="rows()" class="datagrid-table">
    @for (column of columns(); track column.name) {
      <ng-container [matColumnDef]="column.name">
        <th mat-header-cell *matHeaderCellDef class="datagrid-header-cell">{{ column.header }}</th>
        <td mat-cell *matCellDef="let row" class="datagrid-cell">
          <app-ui-datagrid-table-cell-outlet
            [row]="row"
            [column]="column"
          ></app-ui-datagrid-table-cell-outlet>
        </td>
      </ng-container>
    }

    <ng-container matColumnDef="checkbox">
      <th mat-header-cell *matHeaderCellDef class="datagrid-header-cell datagrid-header-checkbox">
        <mat-checkbox
          (change)="$event ? toggleCurrentPage() : null"
          [checked]="isCurrentPageAllSelected()"
          [indeterminate]="isCurrentPageIndeterminate()"
        >
        </mat-checkbox>
      </th>
      <td mat-cell *matCellDef="let row" class="datagrid-cell datagrid-cell-checkbox">
        <mat-checkbox
          (click)="$event.stopPropagation()"
          (change)="$event ? toggleRow(row) : null"
          [checked]="isSelected(row)"
        >
        </mat-checkbox>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th
        mat-header-cell
        *matHeaderCellDef
        class="datagrid-header-cell datagrid-header-actions"
        i18n="@@common.column.actions"
      >
        Actions
      </th>
      <td mat-cell *matCellDef="let row" class="datagrid-cell datagrid-cell-actions">
        <app-ui-datagrid-table-cell-actions
          [row]="row"
          [actions]="actions()"
        ></app-ui-datagrid-table-cell-actions>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns()" class="datagrid-header-row"></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns()"
      class="datagrid-row"
      (click)="onRowClick($event, row)"
    ></tr>
  </table>
</div>
