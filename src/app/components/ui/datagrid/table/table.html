<table mat-table [dataSource]="rows()" class="datagrid-table">
  @for (column of columns(); track column.name) {
    <ng-container [matColumnDef]="column.name">
      <th mat-header-cell *matHeaderCellDef class="datagrid-header-cell">{{ column.header }}</th>
      <td mat-cell *matCellDef="let row" class="datagrid-cell">
        <app-ui-datagrid-table-cell-outlet [row]="row" [column]="column"></app-ui-datagrid-table-cell-outlet>
      </td>
    </ng-container>
  }

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef class="datagrid-header-cell datagrid-header-actions">Actions</th>
    <td mat-cell *matCellDef="let row" class="datagrid-cell datagrid-cell-actions">
      <app-ui-datagrid-table-cell-actions
        [row]="row"
        [actions]="actions()"
      ></app-ui-datagrid-table-cell-actions>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns()" class="datagrid-header-row"></tr>
  <tr
    mat-row
    *matRowDef="let row; columns: displayedColumns()"
    class="datagrid-row"
    (click)="onRowClick($event, row)"
  ></tr>
</table>
