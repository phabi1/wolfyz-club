<div
  class="flex flex-col gap-3 rounded-xl border border-slate-200 bg-slate-50/80 p-3 md:flex-row md:items-center md:justify-between"
>
  <div class="flex items-center gap-2 text-sm text-slate-700">
    <span class="rounded-full border border-slate-300 bg-white px-2.5 py-1 font-semibold"
      >{{ selectedRows().length }} selected</span
    >
  </div>
  <div class="flex-1">
    <mat-form-field class="w-full pb-0">
      <mat-select>
        @for (action of actions(); track $index) {
          <mat-option>{{ action.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </div>
  <div>
    <button mat-raised-button>Apply</button>
  </div>
</div>
