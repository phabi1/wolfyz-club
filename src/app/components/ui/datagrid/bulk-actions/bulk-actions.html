<div
  class="flex flex-col gap-3 rounded-xl border border-slate-200 bg-slate-50/80 p-3 md:flex-row md:items-center md:justify-between"
>
  <div class="flex justify-between items-center gap-2 text-sm text-slate-700">
    <span class="font-bold">{{ selection() }}</span> selected on
    <span class="font-bold">{{ total() }}</span>
  </div>
  <div class="flex">
    @for (action of actions(); track $index) {
      <button mat-raised-button (click)="applyAction(action)">{{ action.label }}</button>
    }
  </div>
</div>
