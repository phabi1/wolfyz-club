<div class="flex flex-col gap-3 p-4 md:flex-row md:items-center md:justify-between md:px-5">
	<p class="text-sm text-slate-600">
		Affichage de <span class="font-semibold text-slate-800">{{ count() }}</span>
		sur <span class="font-semibold text-slate-800">{{ total() > 0 ? total() : count() }}</span> lignes
	</p>

	<div class="flex items-center gap-2">
		<button
			type="button"
			mat-raised-button color="primary"
		(click)="onFirstPage()">
			Premier
		</button>
		<button
			type="button"
			mat-raised-button color="primary"
			(click)="onPreviousPage()"
		>
			Précédent
		</button>
		@for (page of pages(); track page) {
			<button type="button" mat-raised-button color="primary" (click)="onPage(page)">{{ page }}</button>
		}
		<button
			type="button"
			mat-raised-button color="primary"
			(click)="onNextPage()"
		>
			Suivant
		</button>
		<button
			type="button"
			mat-raised-button color="primary"
			(click)="onLastPage()"
		>
			Dernier
		</button>
	</div>
</div>
