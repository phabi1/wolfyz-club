<div class="flex flex-col gap-4 md:flex-row md:items-start md:justify-between">
  <div class="flex flex-row items-center gap-4">
    @if(backLink()) {
    <div>
      <a [routerLink]="backLink()" mat-icon-button><mat-icon>arrow_back</mat-icon></a>
    </div>
    }
    <div class="space-y-1">
      <h1 class="text-2xl font-extrabold tracking-tight text-slate-900 md:text-3xl">
        {{ headingTitle() }}
      </h1>
      @if (headingSubtitle()) {
        <p class="max-w-3xl text-sm leading-relaxed text-slate-600 md:text-base">
          {{ headingSubtitle() }}
        </p>
      }
    </div>
  </div>
  <div class="shrink-0">
    <app-ui-page-actions [actions]="actions()"></app-ui-page-actions>
  </div>
</div>
