<div class="flex flex-col gap-4 md:flex-row md:items-start md:justify-between">
  <div class="space-y-1">
    <h1 class="text-2xl font-extrabold tracking-tight text-slate-900 md:text-3xl">{{ title() }}</h1>
    @if (subtitle()) {
      <p class="max-w-3xl text-sm leading-relaxed text-slate-600 md:text-base">{{ subtitle() }}</p>
    }
  </div>
  <div class="shrink-0">
    <app-ui-page-actions [actions]="actions()"></app-ui-page-actions>
  </div>
</div>
