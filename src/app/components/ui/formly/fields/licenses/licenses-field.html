<div class="space-y-3">
  <div class="flex items-center justify-between">
    <p class="text-sm font-semibold text-slate-800">Licenses</p>
    <button
      type="button"
      (click)="addLicense()"
      class="rounded-lg border border-slate-300 bg-white px-3 py-1 text-xs font-semibold text-slate-700 transition-colors hover:border-slate-400 hover:text-slate-900"
    >
      Add license
    </button>
  </div>

  @if (!items.length) {
    <p class="rounded-lg border border-slate-200 bg-slate-50 p-3 text-xs text-slate-500">
      No license configured.
    </p>
  }

  @for (license of items; track $index) {
    <div class="space-y-3 rounded-xl border border-slate-200 bg-white p-3">
      <div class="grid gap-3 md:grid-cols-2">
        <label class="block">
          <span class="mb-1 block text-xs font-medium text-slate-600">Title</span>
          <input
            type="text"
            [value]="license.title"
            (input)="setTitle($index, $any($event.target).value)"
            class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900"
          />
        </label>

        <label class="block">
          <span class="mb-1 block text-xs font-medium text-slate-600">Amount</span>
          <input
            type="number"
            [value]="license.amount"
            (input)="setAmount($index, $any($event.target).value)"
            class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900"
          />
        </label>

        <label class="block">
          <span class="mb-1 block text-xs font-medium text-slate-600">Year min</span>
          <input
            type="number"
            [value]="license.year_min ?? ''"
            (input)="setYearMin($index, $any($event.target).value)"
            class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900"
          />
        </label>

        <label class="block">
          <span class="mb-1 block text-xs font-medium text-slate-600">Year max</span>
          <input
            type="number"
            [value]="license.year_max ?? ''"
            (input)="setYearMax($index, $any($event.target).value)"
            class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900"
          />
        </label>
      </div>

      <div class="flex justify-end">
        <button
          type="button"
          (click)="removeLicense($index)"
          class="rounded-lg border border-red-200 bg-red-50 px-3 py-1 text-xs font-semibold text-red-700 transition-colors hover:border-red-300"
        >
          Remove
        </button>
      </div>
    </div>
  }
</div>
