<section class="paper" aria-labelledby="request-participants-title">
  <div class="mb-4 flex items-center justify-between gap-3">
    <h2
      id="request-participants-title"
      class="m-0 text-base font-bold tracking-[0.01em] text-slate-900"
    >
      <span i18n="@@membership.requests.participants.title">Participants</span>
    </h2>
    <span class="text-xs text-slate-600" i18n="@@membership.requests.participants.total"
      >{{ participants().length }} total</span
    >
  </div>

  @for (participant of participants(); track $index) {
    <app-membership-request-details-info-participant-item
      [participant]="participant"
      [index]="$index"
      [lessons]="lessons()"
    ></app-membership-request-details-info-participant-item>
  }
</section>
