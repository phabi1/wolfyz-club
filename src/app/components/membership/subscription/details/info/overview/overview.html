<section class="paper accent-card" aria-labelledby="subscription-overview-title">
  <div class="flex flex-col gap-4 md:flex-row md:items-start md:justify-between">
    <div>
      <p
        class="m-0 text-xs uppercase tracking-widest text-slate-500"
        i18n="@@membership.subscriptions.overview.title"
      >
        Subscription
      </p>
      <h2 id="subscription-overview-title" class="mt-1 text-xl font-bold text-slate-900">
        {{ fullName(item().member.firstname, item().member.lastname) }}
      </h2>
      <p class="mt-1 text-sm text-slate-600">
        <app-ui-chip>{{ item().license_type | membershipLicenseType }}</app-ui-chip>
      </p>
    </div>

    <div class="flex flex-wrap items-center gap-2">
      <app-ui-badge [label]="'#' + item().id"></app-ui-badge>
    </div>
  </div>

  <div class="mt-6">
    <app-ui-details>
      <ng-template appUiDetailItem label="Subscribed at" i18n-label="@@membership.subscriptions.overview.subscribedAt">
        {{ item().subscribed_at ? formatTimestamp(item().subscribed_at) : notProvidedLabel }}
      </ng-template>
      <ng-template appUiDetailItem label="Sessions" i18n-label="@@membership.subscriptions.overview.sessions">
        {{ sessionsCount() }}
      </ng-template>
      <ng-template appUiDetailItem label="Contacts" i18n-label="@@membership.subscriptions.overview.contacts">
        {{ contactsCount() }}
      </ng-template>
    </app-ui-details>
  </div>
</section>
