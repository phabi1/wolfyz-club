<app-ui-collection
  title="Sessions"
  i18n-title="@@membership.subscriptions.sessions.title"
  emptyMessage="No session linked to this subscription."
  i18n-emptyMessage="@@membership.subscriptions.sessions.empty"
  addLabel="Add session"
  i18n-addLabel="@@membership.subscriptions.sessions.add"
  [items]="sessions()"
  [itemTpl]="sessionItemTpl"
  [itemActions]="itemActions"
  (addItem)="onAddItem()"
></app-ui-collection>

<ng-template #sessionItemTpl let-session let-editing="editing">
  <header class="mb-3 flex items-start justify-between gap-3">
    <div>
      <h4 class="m-0 text-sm font-bold text-slate-900">{{ sessionTitle(session) }}</h4>
      <h5 class="text-sm font-medium text-slate-500">{{ sessionSubtitle(session) }}</h5>
    </div>
    <app-ui-badge [label]="'#' + session.id"></app-ui-badge>
  </header>

  <dl class="grid grid-cols-1 gap-y-3 md:grid-cols-2 md:gap-x-4">
    <div>
      <dt class="m-0 text-xs uppercase tracking-[0.04em] text-slate-500" i18n="@@membership.subscriptions.sessions.lessonId">Lesson ID</dt>

      <dd class="mt-1 text-[0.95rem] font-medium text-slate-900">{{ session.lesson_id }}</dd>
    </div>
    <div>
      <dt class="m-0 text-xs uppercase tracking-[0.04em] text-slate-500" i18n="@@membership.subscriptions.sessions.subscriptionId">Subscription ID</dt>

      <dd class="mt-1 text-[0.95rem] font-medium text-slate-900">{{ session.subscription_id }}</dd>
    </div>
  </dl>
</ng-template>

<ng-template #formTpl>
  <h1 mat-dialog-title i18n="@@membership.subscriptions.sessions.dialogTitle">Add session</h1>
  <div mat-dialog-content>
    <formly-form [form]="form" [fields]="fields()" [model]="model"></formly-form>
  </div>
  <div mat-dialog-actions>
    <button mat-button mat-dialog-close i18n="@@common.button.cancel">Cancel</button>
    <button mat-button [mat-dialog-close]="model" cdkFocusInitial i18n="@@common.button.add">Add</button>
  </div>
</ng-template>
