<app-ui-dashboard-widget-list heading="Lessons" title="Complétude des cours">
  @for (lesson of sortedLessons(); track lesson.id) {
    <div app-ui-dashboard-widget-list-item>
      <div class="mb-2 flex items-center justify-between gap-3">
        <span class="truncate text-sm font-semibold text-slate-800">{{
          formatLessonTitle(lesson)
        }}</span>
        <span class="text-xs font-semibold text-slate-600">
          {{ lesson.participant_nb }}/{{ lesson.participant_max }}
        </span>
      </div>
      <mat-progress-bar
        class="lesson-progress"
        mode="determinate"
        [value]="
          lesson.participant_max > 0 ? (lesson.participant_nb / lesson.participant_max) * 100 : 0
        "
        [attr.aria-label]="'Taux de participation pour ' + lesson.title"
      ></mat-progress-bar>
    </div>
  }
</app-ui-dashboard-widget-list>
