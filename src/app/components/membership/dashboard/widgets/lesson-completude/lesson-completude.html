<div class="flex h-full min-h-0 flex-col gap-4 p-5 md:p-6">
  <div>
    <p class="text-xs font-semibold uppercase tracking-[0.16em] text-slate-500">Performance</p>
    <h3 class="mt-2 text-lg font-bold text-slate-900">Complétude des cours</h3>
  </div>

  <div class="lesson-list flex-1 min-h-0 space-y-3 overflow-y-auto pr-1">
    @for (lesson of lessons(); track lesson.id) {
      <div class="rounded-xl border border-slate-200 bg-slate-50 p-3">
        <div class="mb-2 flex items-center justify-between gap-3">
          <span class="truncate text-sm font-semibold text-slate-800">{{ lesson.title }}</span>
          <span class="text-xs font-semibold text-slate-600">
            {{ lesson.participant_nb }}/{{ lesson.participant_max }}
          </span>
        </div>
        <mat-progress-bar
          class="lesson-progress"
          mode="determinate"
          [value]="lesson.participant_max > 0 ? (lesson.participant_nb / lesson.participant_max) * 100 : 0"
          [attr.aria-label]="'Taux de participation pour ' + lesson.title"
        ></mat-progress-bar>
      </div>
    } @empty {
      <div class="rounded-xl border border-dashed border-slate-300 bg-slate-50 p-4 text-sm text-slate-600">
        Aucun cours disponible pour le moment.
      </div>
    }
  </div>
</div>
