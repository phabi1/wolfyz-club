<div class="flex h-full min-h-0 flex-col gap-4 p-5 md:p-6">
  <div>
    <p class="text-xs font-semibold uppercase tracking-[0.16em] text-slate-500">Adhérents</p>
    <h3 class="mt-2 text-lg font-bold text-slate-900">Répartition par civilité</h3>
  </div>

  <div class="relative flex-1 min-h-0">
    @if (loading()) {
      <div class="flex h-full items-center justify-center text-sm text-slate-500">Chargement…</div>
    } @else if (total() === 0) {
      <div
        class="flex h-full items-center justify-center rounded-xl border border-dashed border-slate-300 bg-slate-50 p-4 text-sm text-slate-600"
      >
        Aucune inscription pour le moment.
      </div>
    } @else {
      <canvas #canvas aria-label="Répartition des inscriptions par civilité" role="img"></canvas>
    }
  </div>
</div>
