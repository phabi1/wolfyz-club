<div class="flex h-full flex-col justify-between gap-4 p-5 md:p-6">
  <div>
    <p class="text-xs font-semibold uppercase tracking-[0.16em] text-slate-500">Exports</p>
    <h3 class="mt-2 text-lg font-bold text-slate-900">Impression des périodes</h3>
  </div>
  <div class="flex gap-4">
    <mat-form-field class="w-full">
      <mat-select (selectionChange)="onPeriodChange($event)">
        @for (period of periods(); track period.value) {
          <mat-option [value]="period.value">{{ period.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <button
      type="button"
      mat-fab
      class="inline-flex w-fit items-center rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-700 transition-colors hover:border-slate-400 hover:bg-slate-50 hover:text-slate-900"
      (click)="print()"
    >
      <mat-icon>print</mat-icon>
    </button>
  </div>
</div>
