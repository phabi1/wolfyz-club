<app-ui-dashboard-widget-card
  heading="Membership"
  title="Current Campaign"
  description="Quick access to membership management."
  i18n-description=":@@dashboard.widgets.currentCampaign.description"
  i18n-title=":@@dashboard.widgets.currentCampaign.title"
  i18n-description=":@@dashboard.widgets.currentCampaign.description"
>
  @if (campaignId()) {
    <a
      mat-button
      [routerLink]="['/membership/campaign', campaignId()]"
      i18n=":@@dashboard.widgets.currentCampaign.open"
      >Open Campaign</a
    >
  } @else {
    <div
      class="rounded-xl border border-amber-200 bg-amber-50 px-3 py-2 text-sm text-amber-800"
      i18n=":@@dashboard.widgets.currentCampaign.noCampaign"
    >
      No campaign selected.
    </div>
  }
</app-ui-dashboard-widget-card>
